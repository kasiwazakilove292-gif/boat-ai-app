name: Omura Boat AI

on:
  workflow_dispatch:
    inputs:
      race_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2026-09-01"
        type: string
      collect_days:
        description: "Number of days (1-7)"
        required: true
        default: "7"
        type: string
      mode:
        description: "Collection mode"
        required: true
        default: "history"
        type: choice
        options:
          - manual
          - history

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: omura-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install extraction tool
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Choose race dates
        id: dates
        env:
          INPUT_DATE: ${{ github.event.inputs.race_date }}
          INPUT_DAYS: ${{ github.event.inputs.collect_days }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$INPUT_MODE" = "history" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            if [ -f data/history_cursor.txt ]; then
              RACE_DATE=$(cat data/history_cursor.txt)
            else
              RACE_DATE="2024-10-15"
            fi
            COLLECT_DAYS=7
            NEXT_DATE=$(date -d "$RACE_DATE +7 days" +%F)
            echo "$NEXT_DATE" > data/history_cursor.txt
          else
            RACE_DATE="$INPUT_DATE"
            COLLECT_DAYS="${INPUT_DAYS:-1}"
          fi

          echo "race_date=$RACE_DATE" >> "$GITHUB_OUTPUT"
          echo "collect_days=$COLLECT_DAYS" >> "$GITHUB_OUTPUT"

      - name: Collect yesterday's results
        if: github.event_name == 'schedule'
        run: |
          RACE_DATE=$(TZ=Asia/Tokyo date -d 'yesterday' +%F)
          RACE_DATE="$RACE_DATE" COLLECT_DAYS=1 python collect_data.py

      - name: Collect historical results
        env:
          RACE_DATE: ${{ steps.dates.outputs.race_date }}
          COLLECT_DAYS: ${{ steps.dates.outputs.collect_days }}
        run: python collect_data.py

      - name: Save CSV and history progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/omura_results.csv
          if [ -f data/history_cursor.txt ]; then
            git add data/history_cursor.txt
          fi

          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Update Omura results and history progress"
            git push
          fi

      - name: Downloadable CSV backup
        uses: actions/upload-artifact@v4
        with:
          name: omura-results
          path: data/omura_results.csv
          if-no-files-found: error
          retention-days: 30
