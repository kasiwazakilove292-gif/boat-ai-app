name: Omura Boat AI

on:
  workflow_dispatch:
    inputs:
      race_date:
        description: "Race date (YYYY-MM-DD)"
        required: true
        default: "2026-09-02"
        type: string

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install extraction tool
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Choose race date
        id: date
        env:
          INPUT_DATE: ${{ github.event.inputs.race_date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            RACE_DATE="$INPUT_DATE"
          else
            RACE_DATE=$(TZ=Asia/Tokyo date -d 'yesterday' +%F)
          fi
          echo "race_date=$RACE_DATE" >> "$GITHUB_OUTPUT"

      - name: Collect first test date
        env:
          RACE_DATE: "2026-09-01"
        run: python collect_data.py

      - name: Collect selected date
        env:
          RACE_DATE: ${{ steps.date.outputs.race_date }}
        run: python collect_data.py

      - name: Save CSV to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/omura_results.csv
          if git diff --cached --quiet; then
            echo "CSVに変更なし"
          else
            git commit -m "Update Omura race results"
            git push
          fi

      - name: Downloadable CSV backup
        uses: actions/upload-artifact@v4
        with:
          name: omura-results
          path: data/omura_results.csv
          if-no-files-found: error
          retention-days: 30
