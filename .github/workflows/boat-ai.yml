name: Omura Boat AI

on:
  workflow_dispatch:
    inputs:
      race_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2026-09-01"
        type: string
      collect_days:
        description: "Number of days (1-30)"
        required: true
        default: "7"
        type: string
      mode:
        description: "Collection mode"
        required: true
        default: "history"
        type: choice
        options:
          - history
          - manual
          - motor_test
          - entries_test

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: omura-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install extraction tool
        if: github.event.inputs.mode != 'motor_test' && github.event.inputs.mode != 'entries_test'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Choose race dates
        if: github.event.inputs.mode != 'motor_test' && github.event.inputs.mode != 'entries_test'
        id: dates
        env:
          INPUT_DATE: ${{ github.event.inputs.race_date }}
          INPUT_DAYS: ${{ github.event.inputs.collect_days }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          HISTORY_END=$(TZ=Asia/Tokyo date -d 'yesterday' +%F)
          NEXT_DATE=""

          if [ "$INPUT_MODE" = "manual" ]; then
            RACE_DATE="$INPUT_DATE"
            COLLECT_DAYS="${INPUT_DAYS:-1}"
            HISTORY_ACTIVE=false
          else
            if [ -f data/history_cursor.txt ]; then
              RACE_DATE=$(cat data/history_cursor.txt)
            else
              RACE_DATE="2024-10-15"
            fi

            HISTORY_ACTIVE=true

            if [[ "$RACE_DATE" > "$HISTORY_END" ]]; then
              HISTORY_ACTIVE=false
              COLLECT_DAYS=0
            else
              NEXT_DATE=$(date -d "$RACE_DATE +30 days" +%F)

              if [[ "$NEXT_DATE" > "$TODAY" ]]; then
                NEXT_DATE="$TODAY"
              fi

              COLLECT_DAYS=$(( (
                $(date -d "$NEXT_DATE" +%s) -
                $(date -d "$RACE_DATE" +%s)
              ) / 86400 ))
            fi
          fi

          echo "race_date=$RACE_DATE" >> "$GITHUB_OUTPUT"
          echo "collect_days=$COLLECT_DAYS" >> "$GITHUB_OUTPUT"
          echo "history_active=$HISTORY_ACTIVE" >> "$GITHUB_OUTPUT"
          echo "next_date=$NEXT_DATE" >> "$GITHUB_OUTPUT"

      - name: Collect yesterday's results
        if: github.event_name == 'schedule'
        run: |
          RACE_DATE=$(TZ=Asia/Tokyo date -d 'yesterday' +%F)
          RACE_DATE="$RACE_DATE" COLLECT_DAYS=1 python collect_data.py

      - name: Collect historical results
        id: history
        if: ${{ !cancelled() && steps.dates.outputs.history_active == 'true' }}
        env:
          RACE_DATE: ${{ steps.dates.outputs.race_date }}
          COLLECT_DAYS: ${{ steps.dates.outputs.collect_days }}
        run: python collect_data.py

      - name: Advance history progress after success
        if: ${{ !cancelled() && steps.history.outcome == 'success' }}
        env:
          NEXT_DATE: ${{ steps.dates.outputs.next_date }}
        run: |
          test -n "$NEXT_DATE"
          mkdir -p data
          echo "$NEXT_DATE" > data/history_cursor.txt

      - name: Collect manually selected results
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'manual'
        env:
          RACE_DATE: ${{ steps.dates.outputs.race_date }}
          COLLECT_DAYS: ${{ steps.dates.outputs.collect_days }}
        run: python collect_data.py

      - name: Collect motor information
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event.inputs.mode == 'motor_test') }}
        run: python collect_motor.py

      - name: Collect today's entries
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event.inputs.mode == 'entries_test') }}
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          RACE_DATE="$TODAY" COLLECT_DAYS=1 python collect_entries.py

      - name: Rebuild validation summaries
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python build_validation.py

      - name: Save CSV and history progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f data/omura_results.csv ]; then
            git add data/omura_results.csv
          fi

          if [ -f data/history_cursor.txt ]; then
            git add data/history_cursor.txt
          fi

          if [ -f data/omura_motor_history.csv ]; then
            git add data/omura_motor_history.csv
          fi

          if [ -f data/omura_entries.csv ]; then
            git add data/omura_entries.csv
          fi

          for FILE in data/validation_summary.json data/validation_races.csv; do
            if [ -f "$FILE" ]; then
              git add -- "$FILE"
            fi
          done

          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Update Omura collected data"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Downloadable CSV backup
        if: ${{ always() && hashFiles('data/omura_results.csv') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: omura-results
          path: data/omura_results.csv
          retention-days: 30

      - name: Downloadable entries backup
        if: ${{ always() && hashFiles('data/omura_entries.csv') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: omura-entries
          path: data/omura_entries.csv
          retention-days: 30
