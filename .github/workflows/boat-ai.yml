name: Omura Boat AI

on:
  workflow_dispatch:
    inputs:
      race_date:
        description: "Race date (YYYY-MM-DD)"
        required: true
        default: "2026-09-01"
        type: string
  schedule:
    - cron: "0 0 * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      RACE_DATE: ${{ github.event.inputs.race_date || '2026-09-01' }}
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install extraction tool
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Run data collector
        run: python collect_data.py

      - name: Save CSV file
        uses: actions/upload-artifact@v4
        with:
          name: omura-results
          path: data/omura_results.csv
          if-no-files-found: error
          retention-days: 30
