name: BOAT AI LAB Data Quality

on:
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * *'
  push:
    paths:
      - 'data/omura_results.csv'
      - 'data/omura_motor_history.csv'
      - 'scripts/check_data_quality.py'
      - '.github/workflows/data-quality.yml'

permissions:
  contents: read

concurrency:
  group: boat-ai-data-quality
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate historical CSV data
        run: python scripts/check_data_quality.py
