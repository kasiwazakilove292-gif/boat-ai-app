name: Verify BOAT AI LAB

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "*.js"
      - "index.html"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify validation and result matching
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/boat-core.test.cjs
          python build_validation.py
